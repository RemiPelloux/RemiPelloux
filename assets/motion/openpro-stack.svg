<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Engineering at OpenPro</title>
  <desc id="d">Animated architecture sketch: web, iOS and Android clients and ATS integrations talk to a PHP and Symfony core platform, which uses an AI layer in Python with RAG and MCP, plus PostgreSQL and Redis, all running on AWS with Docker and CI/CD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0c1630"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b5cf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2b5cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5cf0"/>
      <stop offset="1" stop-color="#5b3df5"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="470" rx="18"/></clipPath>
    <path id="pWeb" d="M262 128 C330 128 360 210 450 210"/>
    <path id="pIos" d="M262 196 C330 196 370 222 450 222"/>
    <path id="pAnd" d="M262 264 C330 264 370 236 450 236"/>
    <path id="pAts" d="M262 352 C340 352 370 250 450 250"/>
    <path id="pAi" d="M750 214 C820 214 840 140 920 140"/>
    <path id="pData" d="M750 246 C820 246 840 300 920 300"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-variant-ligatures: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .wire { fill: none; stroke: #6f8ff7; stroke-opacity: .6; stroke-width: 2; stroke-dasharray: 3 7; animation: wire 1.2s linear infinite; }
    @keyframes wire { to { stroke-dashoffset: -10; } }
    .glow { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    .coreRing { transform-box: fill-box; transform-origin: center; animation: ring 3.6s ease-out infinite; }
    .cr2 { animation-delay: 1.8s; }
    @keyframes ring { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(1.18, 1.5); } }
    .live { animation: live 2s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .3; } }
    .think { transform-box: fill-box; transform-origin: center; animation: think 1.4s ease-in-out infinite; }
    .th2 { animation-delay: .2s; } .th3 { animation-delay: .4s; }
    @keyframes think { 0%,100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-4px); opacity: 1; } }
    .cloud { animation: slide 30s linear infinite; }
    @keyframes slide { to { transform: translateX(-1101px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pkt { display: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="470" fill="url(#bg)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>
    <ellipse class="glow" cx="600" cy="230" rx="330" ry="220" fill="url(#glow)"/>

    <g class="sans">
      <text x="48" y="54" font-size="12" font-weight="700" letter-spacing="2.4" fill="#8fb0ff">ENGINEERING AT OPENPRO · WHAT I LEAD</text>
    </g>

    <!-- wires -->
    <use href="#pWeb" class="wire"/><use href="#pIos" class="wire"/><use href="#pAnd" class="wire"/><use href="#pAts" class="wire"/>
    <use href="#pAi" class="wire"/><use href="#pData" class="wire"/>

    <!-- packets -->
    <g class="pkt">
      <circle r="4" fill="#8fd8bc"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#pWeb"/></animateMotion></circle>
      <circle r="4" fill="#8fd8bc"><animateMotion dur="3.1s" begin="-1s" repeatCount="indefinite"><mpath href="#pIos"/></animateMotion></circle>
      <circle r="4" fill="#8fd8bc"><animateMotion dur="2.8s" begin="-2s" repeatCount="indefinite"><mpath href="#pAnd"/></animateMotion></circle>
      <circle r="4" fill="#f5c26b"><animateMotion dur="3.4s" begin="-.5s" repeatCount="indefinite"><mpath href="#pAts"/></animateMotion></circle>
      <circle r="4" fill="#c4b5fd"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pAi"/></animateMotion></circle>
      <circle r="4" fill="#c4b5fd"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pAi"/></animateMotion></circle>
      <circle r="4" fill="#f48271"><animateMotion dur="2.4s" begin="-.6s" repeatCount="indefinite"><mpath href="#pData"/></animateMotion></circle>
      <circle r="4" fill="#f48271"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pData"/></animateMotion></circle>
    </g>

    <!-- clients -->
    <g class="sans">
      <text x="48" y="94" font-size="11" font-weight="700" letter-spacing="1.8" fill="#7c8aa5">CLIENTS</text>
      <g transform="translate(48 106)">
        <rect width="214" height="44" rx="11" fill="#111b33" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">Web</text>
        <text x="62" y="28" font-size="13" fill="#9fb0cc">TypeScript · React</text>
      </g>
      <g transform="translate(48 174)">
        <rect width="214" height="44" rx="11" fill="#111b33" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">iOS</text>
        <text x="62" y="28" font-size="13" fill="#9fb0cc">mobile app</text>
      </g>
      <g transform="translate(48 242)">
        <rect width="214" height="44" rx="11" fill="#111b33" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">Android</text>
        <text x="88" y="28" font-size="13" fill="#9fb0cc">mobile app</text>
      </g>
      <text x="48" y="320" font-size="11" font-weight="700" letter-spacing="1.8" fill="#7c8aa5">INTEGRATIONS</text>
      <g transform="translate(48 330)">
        <rect width="214" height="44" rx="11" fill="#1d1a10" stroke="#f5c26b" stroke-opacity="0.35"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">ATS sync</text>
        <text x="96" y="28" font-size="13" fill="#e8cf9a">SDK · MCP</text>
      </g>
    </g>

    <!-- core -->
    <g class="sans" transform="translate(450 166)">
      <rect class="coreRing" width="300" height="128" rx="20" fill="none" stroke="#6f8ff7" stroke-width="2"/>
      <rect class="coreRing cr2" width="300" height="128" rx="20" fill="none" stroke="#8fd8bc" stroke-width="2"/>
      <rect width="300" height="128" rx="20" fill="url(#core)"/>
      <text x="24" y="38" font-size="11" font-weight="700" letter-spacing="1.8" fill="#dbe4ff">CORE PLATFORM</text>
      <text x="24" y="70" font-size="24" font-weight="800" fill="#ffffff">PHP · Symfony</text>
      <text x="24" y="100" font-size="13" fill="#dbe4ff">profiles · video CVs · jobs · messaging</text>
      <circle class="live" cx="272" cy="34" r="5" fill="#8fd8bc"/>
    </g>

    <!-- AI layer -->
    <g class="sans" transform="translate(920 92)">
      <rect width="232" height="104" rx="14" fill="#18143a" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="18" y="30" font-size="11" font-weight="700" letter-spacing="1.8" fill="#c4b5fd">AI LAYER</text>
      <text x="18" y="58" font-size="18" font-weight="800" fill="#ffffff">Python · RAG · MCP</text>
      <text x="18" y="84" font-size="13" fill="#c9c4ee">matching · Mia assistant</text>
      <circle class="think" cx="186" cy="26" r="3.5" fill="#c4b5fd"/>
      <circle class="think th2" cx="198" cy="26" r="3.5" fill="#c4b5fd"/>
      <circle class="think th3" cx="210" cy="26" r="3.5" fill="#c4b5fd"/>
    </g>

    <!-- data -->
    <g class="sans" transform="translate(920 252)">
      <rect width="232" height="104" rx="14" fill="#2a1513" stroke="#f48271" stroke-opacity="0.6"/>
      <text x="18" y="30" font-size="11" font-weight="700" letter-spacing="1.8" fill="#f9a99c">DATA</text>
      <text x="18" y="58" font-size="18" font-weight="800" fill="#ffffff">PostgreSQL · Redis</text>
      <text x="18" y="84" font-size="13" fill="#f3d6d0">storage · cache · real-time</text>
    </g>

    <!-- infra rail -->
    <g transform="translate(0 400)">
      <rect width="1200" height="70" fill="#050811" fill-opacity="0.7"/>
      <path d="M0 0H1200" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="sans" x="48" y="42" font-size="11" font-weight="700" letter-spacing="1.8" fill="#7c8aa5">STACK</text>
      <svg x="140" y="0" width="1060" height="70"><defs><linearGradient id="fade"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".06" stop-color="#fff"/><stop offset=".94" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="fm"><rect width="1060" height="70" fill="url(#fade)"/></mask></defs><g mask="url(#fm)">
        <g class="cloud mono" font-size="14" fill="#cfe0ff"><g><text x="0" y="42">AWS</text><text x="36" y="42" fill="#3b4a6b">◆</text><text x="59" y="42">Docker</text><text x="121" y="42" fill="#3b4a6b">◆</text><text x="144" y="42">CI/CD</text><text x="197" y="42" fill="#3b4a6b">◆</text><text x="220" y="42">PostgreSQL</text><text x="316" y="42" fill="#3b4a6b">◆</text><text x="339" y="42">Redis</text><text x="392" y="42" fill="#3b4a6b">◆</text><text x="415" y="42">PHP · Symfony</text><text x="536" y="42" fill="#3b4a6b">◆</text><text x="559" y="42">TypeScript · React</text><text x="722" y="42" fill="#3b4a6b">◆</text><text x="745" y="42">Python</text><text x="807" y="42" fill="#3b4a6b">◆</text><text x="830" y="42">RAG</text><text x="866" y="42" fill="#3b4a6b">◆</text><text x="889" y="42">MCP</text><text x="925" y="42" fill="#3b4a6b">◆</text><text x="948" y="42">iOS</text><text x="985" y="42" fill="#3b4a6b">◆</text><text x="1008" y="42">Android</text><text x="1078" y="42" fill="#3b4a6b">◆</text></g><g transform="translate(1101 0)"><text x="0" y="42">AWS</text><text x="36" y="42" fill="#3b4a6b">◆</text><text x="59" y="42">Docker</text><text x="121" y="42" fill="#3b4a6b">◆</text><text x="144" y="42">CI/CD</text><text x="197" y="42" fill="#3b4a6b">◆</text><text x="220" y="42">PostgreSQL</text><text x="316" y="42" fill="#3b4a6b">◆</text><text x="339" y="42">Redis</text><text x="392" y="42" fill="#3b4a6b">◆</text><text x="415" y="42">PHP · Symfony</text><text x="536" y="42" fill="#3b4a6b">◆</text><text x="559" y="42">TypeScript · React</text><text x="722" y="42" fill="#3b4a6b">◆</text><text x="745" y="42">Python</text><text x="807" y="42" fill="#3b4a6b">◆</text><text x="830" y="42">RAG</text><text x="866" y="42" fill="#3b4a6b">◆</text><text x="889" y="42">MCP</text><text x="925" y="42" fill="#3b4a6b">◆</text><text x="948" y="42">iOS</text><text x="985" y="42" fill="#3b4a6b">◆</text><text x="1008" y="42">Android</text><text x="1078" y="42" fill="#3b4a6b">◆</text></g></g></g>
      </svg>
    </g>
  </g>
</svg>

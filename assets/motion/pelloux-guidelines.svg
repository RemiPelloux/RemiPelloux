<svg xmlns="http://www.w3.org/2000/svg" width="590" height="400" viewBox="0 0 590 400" role="img" aria-labelledby="t d">
  <title id="t">Pelloux Guidelines, coding rules for AI agents</title>
  <desc id="d">Animated illustration: an audit checks file, function and parameter limits one line at a time, flags a leftover debug statement, and passes once it is removed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#17171c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd08a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4fd08a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="590" height="400" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-variant-ligatures: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ln { opacity: 0; animation: ln 10s ease-out infinite; }
    .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.8s; }
    @keyframes ln { 0% { opacity: 0; } 3%,88% { opacity: 1; } 95%,100% { opacity: 0; } }
    .fail { opacity: 0; animation: fail 10s ease-out 2.4s infinite; }
    @keyframes fail { 0% { opacity: 0; } 3%,34% { opacity: 1; } 38%,100% { opacity: 0; } }
    .pass { opacity: 0; animation: pass 10s ease-out 2.4s infinite; }
    @keyframes pass { 0%,37% { opacity: 0; } 41%,62% { opacity: 1; } 68%,100% { opacity: 0; } }
    .meter { transform-box: fill-box; transform-origin: left center; animation: meter 10s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes meter { 0% { transform: scaleX(0); } 20%,88% { transform: scaleX(1); } 96%,100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ln, .pass { opacity: 1; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="590" height="400" fill="url(#bg)"/>
    <ellipse cx="480" cy="40" rx="260" ry="190" fill="url(#glow)"/>

    <g class="sans">
      <text x="36" y="52" font-size="12" font-weight="700" letter-spacing="2.2" fill="#4fd08a">RULES FOR AI CODING AGENTS</text>
      <text x="36" y="96" font-size="36" font-weight="800" letter-spacing="-1" fill="#f3f1ec">Pelloux Guidelines</text>
      <text x="36" y="126" font-size="16" fill="#a8a6a0">Ten rules. Hard limits. Checked in CI.</text>
    </g>

    <!-- limits -->
    <g class="sans" font-size="12" transform="translate(36 158)">
      <text y="10" fill="#a8a6a0">function</text>
      <rect x="70" y="2" width="148" height="10" rx="5" fill="#ffffff" fill-opacity="0.07"/>
      <rect class="meter" x="70" y="2" width="110" height="10" rx="5" fill="#4fd08a"/>
      <text x="228" y="11" class="mono" fill="#d9d6cf">≤ 25</text>
      <text y="34" fill="#a8a6a0">file</text>
      <rect x="70" y="26" width="148" height="10" rx="5" fill="#ffffff" fill-opacity="0.07"/>
      <rect class="meter" x="70" y="26" width="122" height="10" rx="5" fill="#6aa5ff"/>
      <text x="228" y="35" class="mono" fill="#d9d6cf">≤ 400</text>
      <text y="58" fill="#a8a6a0">params</text>
      <rect x="70" y="50" width="148" height="10" rx="5" fill="#ffffff" fill-opacity="0.07"/>
      <rect class="meter" x="70" y="50" width="88" height="10" rx="5" fill="#f3f1ec"/>
      <text x="228" y="59" class="mono" fill="#d9d6cf">≤ 3</text>
    </g>

    <!-- audit -->
    <g transform="translate(316 152)" class="mono" font-size="12">
      <rect width="238" height="164" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="14" y="26" fill="#4fd08a">$ <tspan fill="#f3f1ec">pelloux-audit</tspan></text>
      <text class="ln" x="14" y="52" fill="#a8a6a0"><tspan fill="#4fd08a">ok</tspan>  file sizes</text>
      <text class="ln l2" x="14" y="74" fill="#a8a6a0"><tspan fill="#4fd08a">ok</tspan>  function length</text>
      <text class="ln l3" x="14" y="96" fill="#a8a6a0"><tspan fill="#4fd08a">ok</tspan>  parameter count</text>
      <text class="ln l4" x="14" y="118" fill="#a8a6a0"><tspan fill="#4fd08a">ok</tspan>  ratchet held</text>
      <text class="fail" x="14" y="146" fill="#ff7a6b">FAIL console.log app.ts:42</text>
      <text class="pass" x="14" y="146" fill="#4fd08a">PASS ready to commit</text>
    </g>

    <g class="sans" font-size="11" fill="#7f7d78" transform="translate(36 248)">
      <text y="0">Agent hook · pre-commit · CI</text>
      <text y="20">Legacy code may shrink, never grow.</text>
    </g>

    <g class="sans" font-size="12" font-weight="600">
      <g transform="translate(36 344)"><rect width="100" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="50" y="18.5" text-anchor="middle" fill="#d9d6cf">9 languages</text></g>
      <g transform="translate(144 344)"><rect width="82" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="41" y="18.5" text-anchor="middle" fill="#d9d6cf">6 agents</text></g>
      <g transform="translate(234 344)"><rect width="126" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="63" y="18.5" text-anchor="middle" fill="#d9d6cf">0 dependencies</text></g>
      <g transform="translate(368 344)"><rect width="114" height="28" rx="14" fill="#4fd08a" fill-opacity="0.16"/><text x="57" y="18.5" text-anchor="middle" fill="#9cefbf">30+ repos</text></g>
      <g transform="translate(490 344)"><rect width="64" height="28" rx="14" fill="#6aa5ff" fill-opacity="0.18"/><text x="32" y="18.5" text-anchor="middle" fill="#b6d2ff">MIT</text></g>
    </g>
  </g>
</svg>

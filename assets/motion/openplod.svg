<svg xmlns="http://www.w3.org/2000/svg" width="590" height="400" viewBox="0 0 590 400" role="img" aria-labelledby="t d">
  <title id="t">OpenPlod, local-first audio vault</title>
  <desc id="d">Animated illustration: a recorder sends audio over Bluetooth, a waveform plays, and transcript lines become a Markdown document.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131a"/>
      <stop offset="1" stop-color="#0b1d2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3975ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3975ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="210" y2="0">
      <stop offset="0" stop-color="#3975ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <clipPath id="frame"><rect width="590" height="400" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-variant-ligatures: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform-box: fill-box; transform-origin: center; animation: eq 1.6s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    .ble { transform-box: fill-box; transform-origin: center; animation: ble 2.4s ease-out infinite; }
    .ble2 { animation-delay: .8s; } .ble3 { animation-delay: 1.6s; }
    @keyframes ble { from { opacity: .8; transform: scale(.4); } to { opacity: 0; transform: scale(1.4); } }
    .play { animation: play 4s linear infinite; }
    @keyframes play { from { transform: translateX(0); } to { transform: translateX(196px); } }
    .ln { transform-box: fill-box; transform-origin: left center; animation: ln 8s cubic-bezier(.16,1,.3,1) infinite; }
    .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; } .n4 { animation-delay: 1.5s; } .n5 { animation-delay: 2s; }
    @keyframes ln { 0% { transform: scaleX(0); opacity: 0; } 8%,85% { transform: scaleX(1); opacity: 1; } 95%,100% { transform: scaleX(1); opacity: 0; } }
    .flow { stroke-dasharray: 4 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="590" height="400" fill="url(#bg)"/>
    <ellipse cx="470" cy="60" rx="260" ry="200" fill="url(#glow)"/>

    <g class="sans">
      <text x="36" y="52" font-size="12" font-weight="700" letter-spacing="2.2" fill="#2dd4bf">AUDIO → KNOWLEDGE · v0.6</text>
      <text x="36" y="96" font-size="38" font-weight="800" letter-spacing="-1" fill="#ffffff">OpenPlod</text>
      <text x="36" y="126" font-size="16" fill="#a9c3d6">Your recordings, as local Markdown.</text>
    </g>

    <!-- recorder + ble -->
    <g transform="translate(70 238)">
      <circle class="ble" r="34" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <circle class="ble ble2" r="34" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <circle class="ble ble3" r="34" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="-20" y="-28" width="40" height="56" rx="9" fill="#12293a" stroke="#3975ee" stroke-width="2"/>
      <circle cy="-8" r="5" fill="#f48271"/>
      <path d="M-8 10H8M-8 16H8" stroke="#5f84a8" stroke-width="2" stroke-linecap="round"/>
      <text class="sans" x="0" y="58" font-size="11" text-anchor="middle" fill="#6f8ba3">Bluetooth</text>
    </g>
    <path class="flow" d="M112 238H140" stroke="#2dd4bf" stroke-width="2" fill="none"/>

    <!-- waveform -->
    <g transform="translate(150 188)">
      <rect width="210" height="100" rx="12" fill="#0d2232" stroke="#ffffff" stroke-opacity="0.08"/>
      <g stroke="url(#wave)" stroke-width="5" stroke-linecap="round">
        <path class="bar" style="animation-delay:-0.1s" d="M20 35V65"/>
        <path class="bar" style="animation-delay:-0.5s" d="M34 25V75"/>
        <path class="bar" style="animation-delay:-0.9s" d="M48 18V82"/>
        <path class="bar" style="animation-delay:-0.3s" d="M62 30V70"/>
        <path class="bar" style="animation-delay:-1.1s" d="M76 22V78"/>
        <path class="bar" style="animation-delay:-0.7s" d="M90 34V66"/>
        <path class="bar" style="animation-delay:-1.3s" d="M104 16V84"/>
        <path class="bar" style="animation-delay:-0.2s" d="M118 28V72"/>
        <path class="bar" style="animation-delay:-0.8s" d="M132 20V80"/>
        <path class="bar" style="animation-delay:-1.4s" d="M146 32V68"/>
        <path class="bar" style="animation-delay:-0.4s" d="M160 24V76"/>
        <path class="bar" style="animation-delay:-1s" d="M174 36V64"/>
        <path class="bar" style="animation-delay:-0.6s" d="M188 28V72"/>
      </g>
      <rect class="play" x="6" y="8" width="2" height="84" fill="#ffffff" fill-opacity="0.7"/>
    </g>
    <path class="flow" d="M366 238H392" stroke="#2dd4bf" stroke-width="2" fill="none"/>

    <!-- markdown doc -->
    <g transform="translate(398 164)">
      <rect width="160" height="150" rx="12" fill="#f4f8fb"/>
      <text class="mono" x="14" y="26" font-size="12" font-weight="700" fill="#0b1d2a"># Meeting notes</text>
      <rect class="ln" x="14" y="42" width="120" height="7" rx="3.5" fill="#3975ee"/>
      <rect class="ln n2" x="14" y="60" width="132" height="7" rx="3.5" fill="#9fb4c7"/>
      <rect class="ln n3" x="14" y="76" width="100" height="7" rx="3.5" fill="#9fb4c7"/>
      <text class="mono" x="14" y="104" font-size="11" fill="#197a68">- [ ] action item</text>
      <rect class="ln n4" x="14" y="114" width="118" height="7" rx="3.5" fill="#9fb4c7"/>
      <rect class="ln n5" x="14" y="130" width="84" height="7" rx="3.5" fill="#2dd4bf"/>
    </g>

    <g class="sans" font-size="12" font-weight="600">
      <g transform="translate(36 344)"><rect width="74" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="37" y="18.5" text-anchor="middle" fill="#cfe0ee">Tauri</text></g>
      <g transform="translate(118 344)"><rect width="74" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="37" y="18.5" text-anchor="middle" fill="#cfe0ee">Rust</text></g>
      <g transform="translate(200 344)"><rect width="100" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="50" y="18.5" text-anchor="middle" fill="#cfe0ee">TypeScript</text></g>
      <g transform="translate(308 344)"><rect width="104" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.16"/><text x="52" y="18.5" text-anchor="middle" fill="#7ff0de">MCP + REST</text></g>
      <g transform="translate(420 344)"><rect width="134" height="28" rx="14" fill="#3975ee" fill-opacity="0.2"/><text x="67" y="18.5" text-anchor="middle" fill="#a9c6ff">Local-first vault</text></g>
    </g>
  </g>
</svg>

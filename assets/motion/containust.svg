<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Containust, daemon-less containers in Rust</title>
  <desc id="d">Animated illustration: a terminal runs ctst pull, plan and run with offline mode, and an api component connects to a db component without any background daemon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0b07"/>
      <stop offset="1" stop-color="#1a130b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <clipPath id="c1"><rect class="tp a1" x="0" y="-16" width="420" height="22"/></clipPath>
    <clipPath id="c2"><rect class="tp a2" x="0" y="-16" width="420" height="22"/></clipPath>
    <clipPath id="c3"><rect class="tp a3" x="0" y="-16" width="420" height="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-variant-ligatures: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tp { transform: translateX(-420px); animation: 10s steps(28) infinite; }
    .a1 { animation-name: tp1; } .a2 { animation-name: tp2; } .a3 { animation-name: tp3; }
    @keyframes tp1 { 0%,2% { transform: translateX(-420px); } 12%,100% { transform: translateX(0); } }
    @keyframes tp2 { 0%,20% { transform: translateX(-420px); } 30%,100% { transform: translateX(0); } }
    @keyframes tp3 { 0%,38% { transform: translateX(-420px); } 52%,100% { transform: translateX(0); } }
    .out { opacity: 0; animation: 10s ease infinite; }
    .o1 { animation-name: o1; } .o2 { animation-name: o2; } .o3 { animation-name: o3; }
    @keyframes o1 { 0%,13% { opacity: 0; } 15%,96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes o2 { 0%,31% { opacity: 0; } 33%,96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes o3 { 0%,53% { opacity: 0; } 55%,96% { opacity: 1; } 100% { opacity: 0; } }
    .lines { animation: fade 10s ease infinite; }
    @keyframes fade { 0%,96% { opacity: 1; } 100% { opacity: 0; } }
    .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: 10s cubic-bezier(.34,1.56,.64,1) infinite; }
    .nd1 { animation-name: nd1; } .nd2 { animation-name: nd2; }
    @keyframes nd1 { 0%,55% { opacity: 0; transform: scale(.6); } 60%,95% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    @keyframes nd2 { 0%,59% { opacity: 0; transform: scale(.6); } 64%,95% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    .link { stroke-dasharray: 6 8; opacity: 0; animation: link 10s linear infinite, dash 1s linear infinite; }
    @keyframes link { 0%,64% { opacity: 0; } 68%,95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -14; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    .strike { stroke-dasharray: 60; stroke-dashoffset: 60; animation: strike 10s ease infinite; }
    @keyframes strike { 0%,70% { stroke-dashoffset: 60; } 76%,95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 60; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .tp { transform: none; } .out, .node, .link { opacity: 1; } .strike { stroke-dashoffset: 0; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <ellipse class="glow" cx="960" cy="180" rx="360" ry="240" fill="url(#glow)"/>

    <g class="sans">
      <text x="56" y="60" font-size="12" font-weight="700" letter-spacing="2.2" fill="#f59e0b">RUST · CONTAINER RUNTIME · GA 1.2</text>
      <text x="56" y="106" font-size="42" font-weight="800" letter-spacing="-1" fill="#ffffff">Containust</text>
      <text x="56" y="138" font-size="17" fill="#d9c7a8">No daemon. Declarative <tspan class="mono" fill="#fcd34d">.ctst</tspan> stacks. Air-gap ready.</text>
    </g>

    <!-- terminal -->
    <g transform="translate(56 168)">
      <rect width="560" height="170" rx="12" fill="#0a0806" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="20" cy="18" r="5" fill="#f48271"/><circle cx="38" cy="18" r="5" fill="#f5c26b"/><circle cx="56" cy="18" r="5" fill="#8fd8bc"/>
      <g class="mono lines" font-size="14" transform="translate(20 52)">
        <g clip-path="url(#c1)"><text><tspan fill="#f59e0b">$ </tspan><tspan fill="#f2e8d5">ctst pull alpine:3.21</tspan></text></g>
        <text class="out o1" x="290" fill="#8fd8bc">✓ digest pinned</text>
        <g transform="translate(0 28)" clip-path="url(#c2)"><text><tspan fill="#f59e0b">$ </tspan><tspan fill="#f2e8d5">ctst plan stack.ctst</tspan></text></g>
        <text class="out o2" x="290" y="28" fill="#8fd8bc">✓ 2 components · 1 link</text>
        <g transform="translate(0 56)" clip-path="url(#c3)"><text><tspan fill="#f59e0b">$ </tspan><tspan fill="#f2e8d5">ctst run stack.ctst --offline</tspan></text></g>
        <text class="out o3" x="0" y="84" fill="#8fd8bc">✓ api, db running · network: none · no daemon</text>
        <rect class="caret" x="0" y="96" width="9" height="16" fill="#f59e0b"/>
      </g>
    </g>

    <!-- composition graph -->
    <g class="sans" transform="translate(700 168)">
      <g transform="translate(0 30)"><g class="node nd1">
        <rect width="170" height="84" rx="14" fill="#241a0e" stroke="#f59e0b" stroke-width="2"/>
        <text class="mono" x="18" y="32" font-size="15" font-weight="700" fill="#fcd34d">COMPONENT api</text>
        <text class="mono" x="18" y="56" font-size="12" fill="#bba98a">port 8080 · 256MiB</text>
      </g></g>
      <path class="link" d="M176 72H262" stroke="#fcd34d" stroke-width="2.5" fill="none"/>
      <g transform="translate(268 30)"><g class="node nd2">
        <rect width="170" height="84" rx="14" fill="#241a0e" stroke="#f59e0b" stroke-width="2"/>
        <text class="mono" x="18" y="32" font-size="15" font-weight="700" fill="#fcd34d">COMPONENT db</text>
        <text class="mono" x="18" y="56" font-size="12" fill="#bba98a">port 5432 · tar://</text>
      </g></g>
      <text class="mono link" style="stroke-dasharray:none" x="186" y="62" font-size="11" fill="#bba98a">CONNECT</text>
      <!-- no daemon badge -->
      <g transform="translate(150 -14)">
        <rect x="-4" y="-18" width="146" height="28" rx="14" fill="#ffffff" fill-opacity="0.06"/>
        <text x="16" y="1" font-size="13" font-weight="600" fill="#d9c7a8">dockerd</text>
        <path class="strike" d="M10 -5H76" stroke="#f48271" stroke-width="2.5"/>
        <text x="84" y="1" font-size="13" font-weight="700" fill="#8fd8bc">none</text>
      </g>
      <g font-size="12" font-weight="600" transform="translate(0 138)">
        <g><rect width="116" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="58" y="18.5" text-anchor="middle" fill="#ecdcc0">namespaces</text></g>
        <g transform="translate(124 0)"><rect width="96" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="48" y="18.5" text-anchor="middle" fill="#ecdcc0">cgroups v2</text></g>
        <g transform="translate(228 0)"><rect width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.07"/><text x="33" y="18.5" text-anchor="middle" fill="#ecdcc0">OCI</text></g>
        <g transform="translate(302 0)"><rect width="136" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2"/><text x="68" y="18.5" text-anchor="middle" fill="#fcd34d">QEMU on mac/win</text></g>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Thanks for stopping by</title>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b5cf0"/><stop offset=".5" stop-color="#8fd8bc"/><stop offset="1" stop-color="#f48271"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="150" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .wave { animation: wave 8s linear infinite; }
    .w2 { animation-duration: 12s; } .w3 { animation-duration: 16s; }
    @keyframes wave { to { transform: translateX(-600px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="#070a12"/>
    <path class="wave w3" d="M0 110 Q150 80 300 110 T600 110 T900 110 T1200 110 T1500 110 T1800 110 V150 H0Z" fill="#f48271" fill-opacity=".5"/>
    <path class="wave w2" d="M0 118 Q150 96 300 118 T600 118 T900 118 T1200 118 T1500 118 T1800 118 V150 H0Z" fill="#8fd8bc" fill-opacity=".55"/>
    <path class="wave" d="M0 128 Q150 112 300 128 T600 128 T900 128 T1200 128 T1500 128 T1800 128 V150 H0Z" fill="#2b5cf0" fill-opacity=".9"/>
    <text class="sans" x="600" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Building useful software across AI, products and systems.</text>
    <text class="sans" x="600" y="88" text-anchor="middle" font-size="14" fill="#7c8aa5">Thanks for stopping by · Rémi</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">LumaSync softly glowing light</title>
  <style>
    .light { animation: light 3.6s cubic-bezier(0.77,0,0.175,1) infinite; }
    .rays { animation: rays 3.6s cubic-bezier(0.77,0,0.175,1) infinite; }
    @keyframes light { 0%,100% { opacity: 0.12; } 50% { opacity: 0.48; } }
    @keyframes rays { 0%,100% { opacity: 0.2; } 50% { opacity: 0.85; } }
